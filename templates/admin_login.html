<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — DZSec</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans Arabic',sans-serif;background:#000;color:#fafafa;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;direction:rtl}
.box{width:100%;max-width:400px;background:#0a0a0a;border:1px solid #1a1a1a;border-radius:24px;padding:36px 28px}
h1{font-size:20px;font-weight:700;margin-bottom:20px;text-align:center}
input{width:100%;padding:16px;background:#050505;border:1px solid #1a1a1a;border-radius:12px;color:#fafafa;font-size:15px;text-align:center;letter-spacing:3px;margin-bottom:12px}
input:focus{outline:none;border-color:#c5ff3d}
button{width:100%;padding:16px;background:#c5ff3d;color:#000;border:none;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer}
.err{background:rgba(255,71,87,.1);color:#ff6b7a;padding:12px;border-radius:10px;font-size:13px;text-align:center;margin-bottom:12px}
</style>
</head>
<body>
<div class="box">
<h1>🛡️ DZSec Admin</h1>
{% if error %}<div class="err">{{ error }}</div>{% endif %}
<form method="POST">
<input type="password" name="password" placeholder="كلمة السر" required autofocus>
<button type="submit">دخول</button>
</form>
</div>
</body>
</html>
