<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DZSec — أمان المواقع</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#000;
  --surface:#0a0a0a;
  --surface-2:#111;
  --border:#1f1f1f;
  --border-2:#2a2a2a;
  --text:#fafafa;
  --muted:#737373;
  --accent:#fff;
  --lime:#c5ff3d;
  --cyan:#00e5ff;
}
html,body{height:100%;}
body{
  font-family:'IBM Plex Sans Arabic',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  padding:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow-x:hidden;
  position:relative;
}
/* نقاط خلفية */
body::before{
  content:'';
  position:fixed;
  inset:0;
  background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,0.05) 1px,transparent 0);
  background-size:24px 24px;
  pointer-events:none;
  z-index:0;
  mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,#000 40%,transparent 100%);
  -webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,#000 40%,transparent 100%);
}
.wrap{
  position:relative;
  z-index:1;
  width:100%;
  max-width:520px;
}

/* الهيدر */
.brand{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 4px;
  margin-bottom:28px;
}
.brand-logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:700;
  font-size:18px;
  letter-spacing:-0.5px;
}
.brand-mark{
  width:28px;height:28px;
  border-radius:8px;
  background:var(--lime);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#000;
  font-weight:900;
  font-size:14px;
}
.brand-status{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:11px;
  color:var(--muted);
  font-family:'JetBrains Mono',monospace;
  padding:5px 10px;
  border:1px solid var(--border);
  border-radius:100px;
}
.brand-status .d{
  width:6px;height:6px;
  background:var(--lime);
  border-radius:50%;
  box-shadow:0 0 10px var(--lime);
  animation:pulse 1.6s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}

/* العنوان */
.hero{
  margin-bottom:24px;
  animation:slideUp 0.5s cubic-bezier(0.16,1,0.3,1);
}
.hero h1{
  font-size:38px;
  font-weight:600;
  line-height:1.1;
  letter-spacing:-1.5px;
  margin-bottom:10px;
}
.hero h1 em{
  font-style:normal;
  color:var(--lime);
}
.hero p{
  color:var(--muted);
  font-size:14px;
  font-weight:400;
}

/* Bento Grid */
.bento{
  display:grid;
  grid-template-columns:1fr;
  gap:10px;
  animation:slideUp 0.5s cubic-bezier(0.16,1,0.3,1) 0.1s backwards;
}
@keyframes slideUp{
  from{opacity:0;transform:translateY(16px);}
  to{opacity:1;transform:translateY(0);}
}

/* بطاقة الفورم */
.form-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:20px;
  padding:20px;
  transition:border-color 0.3s;
}
.form-card:focus-within{
  border-color:var(--border-2);
}
.input-wrap{
  position:relative;
  margin-bottom:12px;
}
.input-wrap svg{
  position:absolute;
  right:16px;
  top:50%;
  transform:translateY(-50%);
  color:var(--muted);
  pointer-events:none;
  transition:color 0.3s;
}
.input-wrap:focus-within svg{color:var(--lime);}
input{
  width:100%;
  padding:16px 48px 16px 16px;
  background:#000;
  border:1px solid var(--border);
  border-radius:14px;
  color:var(--text);
  font-size:15px;
  font-family:'JetBrains Mono',monospace;
  direction:ltr;
  transition:all 0.2s;
}
input:focus{
  outline:none;
  border-color:var(--lime);
  box-shadow:0 0 0 4px rgba(197,255,61,0.08);
}
input::placeholder{color:#404040;}

.btn{
  width:100%;
  padding:16px;
  border:none;
  border-radius:14px;
  background:var(--lime);
  color:#000;
  font-size:15px;
  font-weight:700;
  font-family:inherit;
  cursor:pointer;
  transition:transform 0.15s,box-shadow 0.3s;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  letter-spacing:-0.3px;
}
.btn:hover{box-shadow:0 0 40px rgba(197,255,61,0.3);}
.btn:active{transform:scale(0.98);}

/* الخطأ */
.err{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 14px;
  background:rgba(255,71,87,0.08);
  border:1px solid rgba(255,71,87,0.2);
  border-radius:12px;
  color:#ff6b7a;
  font-size:13px;
  margin-bottom:12px;
}

/* بطاقات صغيرة */
.mini-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.mini{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  padding:16px;
  transition:all 0.2s;
  position:relative;
  overflow:hidden;
}
.mini:hover{
  border-color:var(--border-2);
  transform:translateY(-2px);
}
.mini-num{
  font-family:'JetBrains Mono',monospace;
  font-size:28px;
  font-weight:700;
  letter-spacing:-1px;
  margin-bottom:4px;
  line-height:1;
}
.mini-num.lime{color:var(--lime);}
.mini-num.cyan{color:var(--cyan);}
.mini-num.white{color:var(--text);}
.mini-label{
  font-size:11px;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:1px;
  font-weight:500;
}

/* بطاقة عريضة */
.wide{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  padding:18px;
  display:flex;
  align-items:center;
  gap:14px;
}
.wide-icon{
  width:40px;height:40px;
  border-radius:12px;
  background:linear-gradient(135deg,var(--lime),var(--cyan));
  display:flex;
  align-items:center;
  justify-content:center;
  color:#000;
  flex-shrink:0;
}
.wide-text h3{
  font-size:14px;
  font-weight:600;
  margin-bottom:2px;
}
.wide-text p{
  font-size:12px;
  color:var(--muted);
}

/* التذييل */
.foot{
  text-align:center;
  margin-top:20px;
  font-size:11px;
  color:#404040;
  font-family:'JetBrains Mono',monospace;
  letter-spacing:0.5px;
}
</style>
</head>
<body>
<div class="wrap">
    <div class="brand">
        <div class="brand-logo">
            <div class="brand-mark">DZ</div>
            DZSec
        </div>
        <div class="brand-status">
            <span class="d"></span>
            ONLINE
        </div>
    </div>

    <div class="hero">
        <h1>افحص أمان<br>موقعك <em>في ثوانٍ</em></h1>
        <p>تحليل عميق لـ 8 رؤوس أمنية + HTTPS + SSL</p>
    </div>

    <div class="bento">
        <div class="form-card">
            {% if error %}
            <div class="err">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                {{ error }}
            </div>
            {% endif %}
            <form action="/scan" method="POST">
                <div class="input-wrap">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    <input type="text" name="url" placeholder="example.com" required autocomplete="off" spellcheck="false">
                </div>
                <button class="btn" type="submit">
                    ابدأ الفحص
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                </button>
            </form>
        </div>

        <div class="mini-grid">
            <div class="mini">
                <div class="mini-num lime">08</div>
                <div class="mini-label">Security Headers</div>
            </div>
            <div class="mini">
                <div class="mini-num cyan">SSL</div>
                <div class="mini-label">Certificate Check</div>
            </div>
        </div>

        <div class="wide">
            <div class="wide-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
            </div>
            <div class="wide-text">
                <h3>نتائج فورية</h3>
                <p>تقرير مفصّل بتقييم من A+ إلى F مع توصيات جاهزة</p>
            </div>
        </div>
    </div>

    <div class="foot">DZSEC © 2026 · MADE IN ALGERIA</div>
</div>
</body>
</html>
